services:
  meetingbot:
    container_name: meetingbot
    image: meetingbot:local
    build:
      context: .
    env_file:
      - .env
    environment:
      PORT: "${PORT:-3010}"
    ports:
      - "${PORT:-3010}:${PORT:-3010}"
    init: true
    restart: unless-stopped
    stop_grace_period: 30s
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "const http=require('http'); const port=process.env.PORT || 3009; http.get({host:'127.0.0.1', port, path:'/health'}, (res) => process.exit(res.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1));"
        ]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
