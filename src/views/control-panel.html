<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Meeting Bot Control Panel</title>
        <style>
            :root {
                --bg: #f4f0e8;
                --panel: #fffaf2;
                --line: #d8cdbb;
                --text: #2b251e;
                --muted: #6b6258;
                --accent: #0d6c63;
                --accent-strong: #094d47;
                --danger: #b7482c;
                --chip: #efe5d4;
            }

            * { box-sizing: border-box; }
            body {
                margin: 0;
                padding: 24px;
                background:
                    radial-gradient(circle at top left, #fff7df 0, transparent 28%),
                    linear-gradient(160deg, #f4f0e8 0%, #ede2d0 100%);
                color: var(--text);
                font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
            }
            .shell { width: min(1120px, 100%); margin: 0 auto; display: grid; gap: 20px; }
            .hero, .panel {
                border: 1px solid var(--line);
                border-radius: 22px;
                background: rgba(255, 250, 242, 0.95);
                box-shadow: 0 24px 60px rgba(43, 37, 30, 0.08);
            }
            .hero {
                padding: 24px;
                display: flex;
                flex-wrap: wrap;
                gap: 16px;
                align-items: center;
                justify-content: space-between;
            }
            .hero h1 { margin: 0; font-size: clamp(2rem, 4vw, 3rem); }
            .hero p { margin: 8px 0 0; color: var(--muted); max-width: 680px; line-height: 1.5; }
            .layout { display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(320px, 0.9fr); gap: 20px; }
            .panel { padding: 22px; }
            .panel h2 { margin: 0 0 14px; font-size: 1.2rem; }
            .stats { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 12px; }
            .stat { padding: 14px; border-radius: 16px; background: var(--chip); }
            .stat span { display: block; color: var(--muted); font-size: 0.88rem; }
            .stat strong { display: block; margin-top: 6px; font-size: 1.05rem; }
            form { display: grid; gap: 14px; }
            label { display: block; margin-bottom: 6px; font-weight: 600; }
            input, select, button { width: 100%; border-radius: 12px; font: inherit; }
            input, select { padding: 12px 14px; border: 1px solid var(--line); background: white; color: var(--text); }
            button { padding: 12px 16px; border: none; cursor: pointer; color: white; background: var(--accent); font-weight: 600; }
            button.secondary { background: #8d7d66; }
            button.leave { background: var(--danger); }
            button:disabled { opacity: 0.6; cursor: wait; }
            .meetings { display: grid; gap: 14px; }
            .meeting { padding: 16px; border: 1px solid var(--line); border-radius: 18px; background: white; }
            .chip-row { display: flex; flex-wrap: wrap; gap: 8px; margin: 8px 0 12px; }
            .chip { padding: 6px 10px; border-radius: 999px; background: var(--chip); font-size: 0.84rem; font-weight: 600; }
            .meta { display: grid; gap: 10px; color: var(--muted); font-size: 0.94rem; word-break: break-word; }
            .meta strong { color: var(--text); }
            .actions { margin-top: 14px; display: flex; gap: 10px; }
            .notice { min-height: 24px; color: var(--muted); font-size: 0.95rem; }
            .notice.error { color: var(--danger); }
            .empty { padding: 18px; border-radius: 18px; background: var(--chip); color: var(--muted); }
            a { color: var(--accent-strong); }
            @media (max-width: 900px) {
                .layout { grid-template-columns: 1fr; }
                .stats { grid-template-columns: repeat(2, minmax(0, 1fr)); }
            }
        </style>
    </head>
    <body>
        <div class="shell">
            <section class="hero">
                <div>
                    <h1>Meeting Bot Control Panel</h1>
                    <p>
                        Recall.ai bot creation is active. Submit a meeting, track the persisted
                        lifecycle state here, and use Leave Meeting when you need to stop a live bot.
                    </p>
                </div>
                <form method="POST" action="/control-panel/logout">
                    <button class="secondary" type="submit">Log Out</button>
                </form>
            </section>

            <section class="panel">
                <h2>Runtime Overview</h2>
                <div class="stats" id="stats"></div>
            </section>

            <div class="layout">
                <section class="panel">
                    <h2>Invite Bot</h2>
                    <form id="invite-form">
                        <div>
                            <label for="meetingUrl">Meeting URL</label>
                            <input type="text" id="meetingUrl" name="meetingUrl" placeholder="https://..." required />
                        </div>
                        <div>
                            <label for="meetingSubject">Meeting Subject</label>
                            <input type="text" id="meetingSubject" name="meetingSubject" placeholder="Weekly sync" required />
                        </div>
                        <div>
                            <label for="botDisplayName">Bot Name</label>
                            <input type="text" id="botDisplayName" name="botDisplayName" placeholder="IWKZ Bot" value="IWKZ Bot" required />
                        </div>
                        <div>
                            <label for="meetingType">Meeting Type</label>
                            <select id="meetingType" name="meetingType" required>
                                <option value="seminar">Seminar</option>
                                <option value="rapat">Rapat</option>
                            </select>
                        </div>
                        <button type="submit">Start Bot</button>
                    </form>
                    <p class="notice" id="invite-notice"></p>
                </section>

                <section class="panel">
                    <h2>Meetings</h2>
                    <div class="meetings" id="meetings">
                        <div class="empty">Loading meeting state...</div>
                    </div>
                </section>
            </div>
        </div>

        <script>
            const statsNode = document.getElementById('stats');
            const meetingsNode = document.getElementById('meetings');
            const inviteForm = document.getElementById('invite-form');
            const inviteNotice = document.getElementById('invite-notice');
            let leaveInFlightMeetingId = null;

            function formatTime(value) {
                if (!value) return '-';
                const date = new Date(value);
                return Number.isNaN(date.getTime()) ? value : date.toLocaleString();
            }

            function escapeHtml(value) {
                return String(value ?? '')
                    .replaceAll('&', '&amp;')
                    .replaceAll('<', '&lt;')
                    .replaceAll('>', '&gt;')
                    .replaceAll('"', '&quot;')
                    .replaceAll("'", '&#39;');
            }

            function canLeaveMeeting(meeting) {
                return Boolean(
                    meeting.recallBotId &&
                    !['completed', 'completed_with_errors', 'failed'].includes(meeting.status)
                );
            }

            function formatStatusLabel(status) {
                const labels = {
                    creating_bot: 'Creating Bot',
                    joining: 'Joining',
                    waiting_room: 'Waiting Room',
                    in_call_not_recording: 'In Call',
                    recording: 'Recording',
                    leaving: 'Leaving',
                    call_ended: 'Call Ended',
                    recording_processing: 'Processing Recording',
                    transcribing: 'Transcribing',
                    uploading: 'Uploading',
                    completed: 'Completed',
                    completed_with_errors: 'Completed With Errors',
                    failed: 'Failed',
                };

                return labels[status] || status;
            }
            async function fetchState() {
                const response = await fetch('/api/control-panel/state', { credentials: 'same-origin' });
                if (response.status === 401) {
                    window.location.href = '/control-panel';
                    return;
                }
                if (!response.ok) throw new Error('Could not load control panel state');
                const payload = await response.json();
                renderStats(payload.stats);
                renderMeetings(payload.meetings);
            }

            function renderStats(stats) {
                statsNode.innerHTML = `
                    <div class="stat"><span>Active Meetings</span><strong>${escapeHtml(stats.activeMeetings)}</strong></div>
                    <div class="stat"><span>Completed</span><strong>${escapeHtml(stats.completedMeetings)}</strong></div>
                    <div class="stat"><span>Failed</span><strong>${escapeHtml(stats.failedMeetings)}</strong></div>
                    <div class="stat"><span>Last Started</span><strong>${escapeHtml(formatTime(stats.lastStartedAt))}</strong></div>
                    <div class="stat"><span>Last Error</span><strong>${escapeHtml(stats.lastError || '-')}</strong></div>
                `;
            }

            function renderMeetings(meetings) {
                if (!meetings.length) {
                    meetingsNode.innerHTML = '<div class="empty">No meeting jobs stored yet.</div>';
                    return;
                }

                meetingsNode.innerHTML = meetings.map((meeting) => {
                    const leaveButton = canLeaveMeeting(meeting)
                        ? `<div class="actions"><button class="leave" data-meeting-id="${escapeHtml(meeting.id)}" ${leaveInFlightMeetingId === meeting.id ? 'disabled' : ''}>${leaveInFlightMeetingId === meeting.id ? 'Leaving...' : 'Leave Meeting'}</button></div>`
                        : '';

                    return `
                    <article class="meeting">
                        <h3>${escapeHtml(meeting.meetingSubject)}</h3>
                        <div class="chip-row">
                            <span class="chip">${escapeHtml(meeting.id)}</span>
                            <span class="chip">${escapeHtml(meeting.meetingType)}</span>
                            <span class="chip">${escapeHtml(formatStatusLabel(meeting.status))}</span>
                            <span class="chip">${escapeHtml(meeting.botDisplayName)}</span>
                        </div>
                        <div class="meta">
                            <div><strong>Meeting URL:</strong> ${escapeHtml(meeting.meetingUrl)}</div>
                            <div><strong>Recall Bot ID:</strong> ${escapeHtml(meeting.recallBotId || '-')}</div>
                            <div><strong>Recall Code:</strong> ${escapeHtml(meeting.recallStatusCode || '-')}</div>
                            <div><strong>Recall Subcode:</strong> ${escapeHtml(meeting.recallStatusSubCode || '-')}</div>
                            <div><strong>Recall Message:</strong> ${escapeHtml(meeting.recallStatusMessage || '-')}</div>
                            <div><strong>Created:</strong> ${escapeHtml(formatTime(meeting.createdAt))}</div>
                            <div><strong>Joined:</strong> ${escapeHtml(formatTime(meeting.joinedAt))}</div>
                            <div><strong>Completed:</strong> ${escapeHtml(formatTime(meeting.completedAt))}</div>
                            <div><strong>Last Error:</strong> ${escapeHtml(meeting.lastError || '-')}</div>
                            <div><strong>Video:</strong> ${meeting.videoUpload ? `<a target="_blank" rel="noopener noreferrer" href="${escapeHtml(meeting.videoUpload.link)}">${escapeHtml(meeting.videoUpload.name)}</a>` : '-'}</div>
                            <div><strong>Transcript JSON:</strong> ${meeting.transcriptJsonUpload ? `<a target="_blank" rel="noopener noreferrer" href="${escapeHtml(meeting.transcriptJsonUpload.link)}">${escapeHtml(meeting.transcriptJsonUpload.name)}</a>` : '-'}</div>
                            <div><strong>Transcript TXT:</strong> ${meeting.transcriptTextUpload ? `<a target="_blank" rel="noopener noreferrer" href="${escapeHtml(meeting.transcriptTextUpload.link)}">${escapeHtml(meeting.transcriptTextUpload.name)}</a>` : '-'}</div>
                        </div>
                        ${leaveButton}
                    </article>`;
                }).join('');

                for (const button of meetingsNode.querySelectorAll('button[data-meeting-id]')) {
                    button.addEventListener('click', async () => {
                        const meetingId = button.getAttribute('data-meeting-id');
                        if (!meetingId) return;

                        leaveInFlightMeetingId = meetingId;
                        inviteNotice.className = 'notice';
                        inviteNotice.textContent = 'Sending leave request...';
                        renderMeetings(meetings);

                        try {
                            const response = await fetch(`/api/control-panel/meetings/${encodeURIComponent(meetingId)}/leave`, {
                                method: 'POST',
                                credentials: 'same-origin',
                            });
                            const result = await response.json().catch(() => ({}));
                            inviteNotice.className = response.ok ? 'notice' : 'notice error';
                            inviteNotice.textContent = result.message || 'Leave request failed.';
                        } catch {
                            inviteNotice.className = 'notice error';
                            inviteNotice.textContent = 'Leave request failed.';
                        } finally {
                            leaveInFlightMeetingId = null;
                            await fetchState().catch(() => {});
                        }
                    });
                }
            }

            inviteForm.addEventListener('submit', async (event) => {
                event.preventDefault();
                inviteNotice.className = 'notice';
                inviteNotice.textContent = 'Submitting Recall bot join request...';

                const payload = Object.fromEntries(new FormData(inviteForm).entries());
                const response = await fetch('/api/control-panel/invite', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    credentials: 'same-origin',
                    body: JSON.stringify(payload),
                });
                const result = await response.json().catch(() => ({}));

                inviteNotice.className = response.ok ? 'notice' : 'notice error';
                inviteNotice.textContent = result.message || 'Request failed.';
                await fetchState().catch(() => {});
            });

            fetchState();
            window.setInterval(fetchState, 5000);
        </script>
    </body>
</html>
