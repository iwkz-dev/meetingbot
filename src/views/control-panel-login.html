<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Meeting Bot Control Panel Login</title>
        <style>
            :root {
                --bg: #f4f0e8;
                --panel: #fffaf2;
                --line: #d8cdbb;
                --text: #2b251e;
                --muted: #6b6258;
                --accent: #0d6c63;
                --accent-strong: #094d47;
                --danger: #b7482c;
            }

            * {
                box-sizing: border-box;
            }

            body {
                margin: 0;
                min-height: 100vh;
                display: grid;
                place-items: center;
                padding: 24px;
                background:
                    radial-gradient(
                        circle at top left,
                        #fff7df 0,
                        transparent 32%
                    ),
                    linear-gradient(145deg, #f4f0e8 0%, #efe5d4 100%);
                color: var(--text);
                font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            }

            .panel {
                width: min(420px, 100%);
                padding: 28px;
                border: 1px solid var(--line);
                border-radius: 20px;
                background: rgba(255, 250, 242, 0.96);
                box-shadow: 0 24px 70px rgba(43, 37, 30, 0.12);
            }

            h1 {
                margin: 0 0 10px;
                font-size: 1.9rem;
            }

            p {
                margin: 0 0 20px;
                color: var(--muted);
                line-height: 1.5;
            }

            form {
                display: grid;
                gap: 14px;
            }

            label {
                font-weight: 600;
            }

            input {
                width: 100%;
                padding: 12px 14px;
                border: 1px solid var(--line);
                border-radius: 12px;
                background: #fff;
                color: var(--text);
                font-size: 1rem;
            }

            button {
                padding: 12px 16px;
                border: none;
                border-radius: 12px;
                background: var(--accent);
                color: white;
                font-size: 1rem;
                font-weight: 600;
                cursor: pointer;
            }

            button:hover {
                background: var(--accent-strong);
            }

            .error {
                display: none;
                margin-bottom: 16px;
                padding: 12px 14px;
                border-radius: 12px;
                background: rgba(183, 72, 44, 0.12);
                color: var(--danger);
                font-size: 0.95rem;
            }
        </style>
    </head>
    <body>
        <main class="panel">
            <h1>Control Panel</h1>
            <div class="error" id="login-error">Password does not match!</div>
            <form method="POST" action="/control-panel/login">
                <div>
                    <label for="password">Password</label>
                    <input
                        id="password"
                        name="password"
                        type="password"
                        autocomplete="current-password"
                        required
                    />
                </div>
                <button type="submit">Enter Bot Panel</button>
            </form>
        </main>

        <script>
            const params = new URLSearchParams(window.location.search);
            if (params.get('error') === '1') {
                document.getElementById('login-error').style.display = 'block';
            }
        </script>
    </body>
</html>
